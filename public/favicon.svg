<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    サイトの中核原則をそのままアイコンにしたもの。
    「闇が主役で、光は例外である」— 面積のほとんどが純黒で、
    灯っている窓は1つだけ（--c-signal）。残りは微光の窓。
    小さいサイズでも潰れないよう、要素は矩形のみで構成している。
  -->
  <rect width="32" height="32" fill="#000000" />

  <!-- 消灯している窓 -->
  <g fill="#1A0740">
    <rect x="6" y="6" width="6" height="8" />
    <rect x="20" y="6" width="6" height="8" />
    <rect x="6" y="18" width="6" height="8" />
  </g>

  <!-- 灯っている窓（1つだけ） -->
  <rect x="20" y="18" width="6" height="8" fill="#4805F1" />
</svg>
